draw_config:
  n_columns: 1
  draw_key_sides: true
  key_w: 60.0
  key_h: 56.0
  split_gap: 180.0
  combo_w: 28.0
  combo_h: 26.0
  key_rx: 6.0
  key_ry: 6.0
  inner_pad_w: 2.0
  inner_pad_h: 2.0
  outer_pad_w: 40.0
  outer_pad_h: 56.0
  line_spacing: 1.2
  arc_radius: 6.0
  append_colon_to_layer_header: true
  small_pad: 2.0
  svg_extra_style: |
    /* For default sytles, see https://github.com/caksoylar/keymap-drawer/blob/main/keymap_drawer/config.py#L85 */

    svg.keymap {
      font-family: Sometype Mono, Ubuntu Mono, Inconsolata, Consolas, Liberation Mono, Menlo, monospace;
      font-size: 18px;
      font-weight: bold;
      text-rendering: optimizeLegibility;
      fill: #777;
    }
    
    /* default key styling */
    rect.key {
      fill: #272727;
    }
    rect.key, rect.combo {
      stroke: #111;
      stroke-width: 1;
    }
    /* color accent for combo boxes */
    rect.combo, rect.combo-separate {
      fill: #0f577e;
    }
    
    /* default key side styling, only used is draw_key_sides is set */
    rect.side {
      filter: brightness(80%);
    }

    text {
      text-anchor: middle;
      dominant-baseline: hanging;
    }
    
    /* styling for layer labels */
    text.label {
      font-size: 40px;
      font-weight: bold;
      text-anchor: start;
      stroke: black;
      stroke-width: 6;
      paint-order: stroke;
    }
    text.layer-activator {
      font-size: 12px;
      font-weight: bold;
    }
    
    /* styling for combo tap, and key non-tap label text */
    text.combo, text.hold, text.shifted, text.left, text.right {
      font-size: 18px;
      font-weight: bold;
      fill: #b8ca2f;
    }
    
    text.hold {
      text-anchor: middle;
      dominant-baseline: auto;
    }
  
    text.shifted {
      text-anchor: middle;
      dominant-baseline: hanging;
    }

    /* Color accent for held keys */
    rect.held, rect.combo.held {
      fill: #622fca;
    }

    /* Technique borrowed and extended from https://github.com/englmaxi/zmk-config/blob/master/keymap-drawer/config.yaml */
    .sym_sub_text.tap {
      translate: -5px 2px;
      font-size: 20px;
    }
    .sym_sub_text.shifted {
      translate: 10px 13px;
      font-size: 10px;
      opacity: 1.0;
    }
    .combo.sym_sub_text.tap {
      translate: -1px 1px;
    }
    .combo.sym_sub_text.shifted {
      translate: 7px 5px;
      font-size: 10px;
      opacity: 1.0;
    }

    /* Toggle */
    .toggle.shifted {
      translate: -10px 12px;
    }

    .toggle.hold {
      translate: 13px -23px;
    }

    /* Variant for tap-dances */
    .tap_dance.tap {
      translate: -7px 0px;
      font-size: 12px;
    }
    .tap_dance.shifted {
      translate: 7px 17px;
      font-size: 12px;
      opacity: 1.0;
    }

    /* Variant for symbol next to symbol */
    .sym_by_sym.tap {
      translate: -6px 0px;
    }
    .sym_by_sym.shifted {
      translate: 10px 12px;
      opacity: 1.0;
    }

    .combo.sym_by_sym.tap {
      translate: -35px 0px;
    }
    .combo.sym_by_sym.shifted {
      translate: 35px 20px;
      opacity: 1.0;
    }

    .combo.sym_by_sym.hold {
      visibility: hidden;
    }

    /* hide hold box for combo sym_by_sym */
    .combo.sym_by_sym.hold > path[stroke="none"][fill="none"] {
      visibility: hidden;
    }

  shrink_wide_legends: 5
  glyph_tap_size: 18
  glyph_hold_size: 15
  glyph_shifted_size: 15
  glyphs: {}
  glyph_urls:
    tabler: https://unpkg.com/@tabler/icons/icons/outline/{}.svg
    tablerf: https://unpkg.com/@tabler/icons/icons/filled/{}.svg
    mdi: https://raw.githubusercontent.com/Templarian/MaterialDesign-SVG/master/svg/{}.svg
    mdil: https://raw.githubusercontent.com/Pictogrammers/MaterialDesignLight/master/svg/{}.svg
    material: https://fonts.gstatic.com/s/i/short-term/release/materialsymbolsoutlined/{}/default/48px.svg
  use_local_cache: true

parse_config:
  mark_alternate_layer_activators: false
  sticky_label: stky
  toggle_label: togl
  trans_legend:
    tap: ▽
    type: trans

  raw_binding_map:
    # Layers
    "&to ALPHAS":
      tap: 𝜶
    "&mo DIGITS":
      tap: ℤ
    "&sl FUNCTS":
      tap: 𝒇
    "&mo SYMBLS":
      tap: ±
    "&mo M_BTNS":
      tap: 🖰
    "&mo SCROLL":
      tap: 🡙
    "&mo LOWDPI":
      tap: 🕀
    "&ltq 1 BACKSPACE":
      tap:  $$mdi:backspace$$
      hold: '$$mdi:navigation-variant$$'
    "&ltq 3 TAB":
      tap: $$mdi:keyboard-tab$$
      hold: $$mdi:numeric$$
    "&ltq 2 SPACE":
      tap: $$mdi:keyboard-space$$
      hold: $$mdi:symbol$$
    "&ltq 3 ENTER":
      tap: $$mdi:keyboard-return$$
      hold: $$mdi:numeric$$
    "&ltq 1 DELETE":
      tap: $$mdi:backspace-reverse-outline$$
      hold: $$mdi:navigation-variant$$

    # Home rows
    "&hm LEFT_GUI A":
      tap: 'A'
      shifted: $$mdi:apple-keyboard-command$$
    "&hm LEFT_ALT S":
      tap: 'S'
      shifted: $$mdi:apple-keyboard-option$$
    "&hm LEFT_CONTROL D":
      tap: 'D'
      shifted: $$mdi:apple-keyboard-control$$
    "&hm LEFT_SHIFT F":
      tap: 'F'
      shifted: $$mdi:apple-keyboard-shift$$
    "&hm RIGHT_SHIFT J":
      tap: 'J'
      shifted: $$mdi:apple-keyboard-shift$$
    "&hm RIGHT_CONTROL K":
      tap: 'K'
      shifted: $$mdi:apple-keyboard-control$$
    "&hm RIGHT_ALT L":
      tap: 'L'
      shifted: $$mdi:apple-keyboard-option$$
    # self behaviors
    "&hm LG(LS(V)) P":
      tap: 'P'
      shifted: $$mdi:content-copy$$

    # Mouse
    "&msc SCRL_UP":
      tap: $$mdi:pan-up$$
      hold: ''
      shifted: ''
    "&msc SCRL_DOWN":
      tap: $$mdi:pan-down$$
      hold: ''
      shifted: ''
    "&msc SCRL_LEFT":
      tap: $$mdi:pan-left$$
      hold: ''
      shifted: ''
    "&msc SCRL_RIGHT":
      tap: $$mdi:pan-right$$
      hold: ''
      shifted: ''
    "&mmv MOVE_LEFT":
      tap: $$mdi:menu-left$$
      hold: ''
      shifted: $$mdi:mouse$$
    "&mmv MOVE_RIGHT":
      tap: $$mdi:menu-right$$
      hold: ''
      shifted: $$mdi:mouse$$
    "&mmv MOVE_UP":
      tap: $$mdi:menu-up$$
      hold: ''
      shifted: $$mdi:mouse$$
    "&mmv MOVE_DOWN":
      tap: $$mdi:menu-down$$
      hold: ''
      shifted: $$mdi:mouse$$
    "&mkp LCLK":
      tap: $$mdi:mouse-left-click-outline$$
    "&mkp MB1":
      tap: $$mdi:mouse-left-click-outline$$
    "&mkp RCLK":
      tap: $$mdi:mouse-right-click-outline$$
    "&mkp MB2":
      tap: $$mdi:mouse-right-click-outline$$
    "&mkp MCLK":
      tap: $$mdi:mouse-scroll-wheel$$
    "&mkp MB3":
      tap: $$mdi:mouse-scroll-wheel$$
    "&mkp MB4":
      tap: $$mdi:arrow-left-box$$
    "&mkp MB5":
      tap: $$mdi:arrow-right-box$$

    # Modifiers
    "&td_SHFTCAPS":
      tap: ⇧
      hold: $$mdi:apple-keyboard-caps$$
    "&macro_hex_pfx":
      tap: '0x'
    "&uc 0x2014 0":
      tap: —
    "&morph_JUSTDOT":
      tap: '.'
      shifted: ''
    "&morph_JUSTCOMMA":
      tap: ','
      shifted: ''

    # Empty
    "&none":
      tap: ""
      type: none

  # ZMK
  zmk_keycode_map:
    # Symbols
    EXCLAMATION: "!"
    EXCL: "!"
    AT_SIGN: "@"
    AT: "@"
    HASH: "#"
    POUND: "#"
    DOLLAR: "$"
    DLLR: "$"
    PERCENT: "%"
    PRCNT: "%"
    CARET: "^"
    AMPERSAND: "&"
    AMPS: "&"
    ASTERISK: "*"
    ASTRK: "*"
    STAR: "*"
    LEFT_PARENTHESIS: "("
    LPAR: "("
    RIGHT_PARENTHESIS: ")"
    RPAR: ")"
    KP_PLUS: "+"
    KP_MINUS: "-"
    KP_MULTIPLY: "*"
    KP_DIVIDE: "/"
    EQUAL: "="
    PLUS: "+"
    MINUS: "-"
    UNDERSCORE: "_"
    UNDER: "_"
    SLASH: "/"
    FSLH: "/"
    QUESTION: "?"
    QMARK: "?"
    BACKSLASH: '\'
    BSLH: '\'
    NON_US_BACKSLASH: '\'
    NON_US_BSLH: '\'
    PIPE: "|"
    PIPE2: "|"
    SEMICOLON:
      tap: ";"
      shifted: ":"
    SEMI:
      tap: ";"
      shifted: ":"
    COLON: ":"
    SINGLE_QUOTE:
      tap: "'"
      shifted: '"'
    SQT:
      tap: "'"
      shifted: '"'
    APOSTROPHE:
      tap: "'"
      shifted: '"'
    APOS:
      tap: "'"
      shifted: '"'
    LS(APOS): '"'
    DOUBLE_QUOTES: '"'
    DQT: '"'
    LESS_THAN: "<"
    LT: "<"
    PERIOD: '.'
    DOT: "."
    COMMA: ","
    GREATER_THAN: ">"
    GT: ">"
    LEFT_BRACKET: "["
    LBKT: "["
    LEFT_BRACE: "{"
    LBRC: "{"
    RIGHT_BRACKET: "]"
    RBKT:  "]"
    RIGHT_BRACE: "}"
    RBRC: "}"
    GRAVE:
      tap: "`"
      shifted: "~"
    LS(GRAVE): "~"
    TILDE: "~"
    TILDE2: "~"
    NON_US_HASH: "#"
    NUHS: "#"

    # Numbers
    N1: "1"
    N2: "2"
    N3: "3"
    N4: "4"
    N5: "5"
    N6: "6"
    N7: "7"
    N8: "8"
    N9: "9"
    N0: "0"

    # Modifiers
    LCTRL: ⎈
    RCTRL: ⎈

    LALT: ⎇
    RALT: ⎇

    LSHFT: ⇧
    RSHFT: ⇧

    CAPS: ⇪

    LGUI: 🐧
    RGUI: 🐧

    LC(C): ⧉
    LC(X): ✀
    LC(V): 📋︎
    LC(S): 🖫

    # Arrows
    UP: ▲
    UP_ARROW: ▲
    DOWN: ▼
    DOWN_ARROW: ▼
    LEFT_ARROW: ◀
    LEFT: ◀
    RIGHT: ▶
    RIGHT_ARROW: ▶
    HOME: ⇤
    END: ⇥
    PG_UP: ⍐
    PAGE_UP: ⍐
    PG_DN: ⍗
    PAGE_DOWN: ⍗
    INSERT: ⎀

    # Whitespace
    ENTER: ↵
    RET: ↵
    ESC: ⎋
    ESCAPE: ⎋
    TAB: ↹
    LS(TAB): ↹
    SPACE: ␣
    BACKSPACE: ⌫
    BSPC: ⌫
    DELETE: ⌦
    DEL: ⌦

    # Sound
    K_VOL_UP: 🕪
    K_VOL_DN: 🕩
    C_MUTE: 🕨
    C_VOL_UP: 🕪
    C_VOL_DN: 🕩
    C_VOLUME_UP: 🕪
    C_VOLUME_DOWN: 🕩

    # Media
    C_NEXT: ⏭
    C_PREV: ⏮
    C_PP: ⏯
    C_PLAY_PAUSE: ⏯

    combo_semicolon:
      key:
        shifted: ":"
        hold: ";"
