on:
  push:
    # be aware of limited YAML anchor syntax support in GH Actions. See https://frenck.dev/github-actions-yaml-anchors-aliases-merge-keys/
    paths-ignore: &PATHS_IGNORE
      - '**/keymap_drawer.yml'
      - '**/keyball44.json'
      - 'keymap-drawer/**'
      - '.gitignore'
      - 'keymap_drawer.config.yaml'
      - 'README.md'
  pull_request:
    paths-ignore: *PATHS_IGNORE
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3 # version pinned to avoid breaking changes; see https://zmk.dev/blog/2025/06/20/pinned-zmk
